# Extra R8 rules for the release build. .NET for Android already keeps every Java-callable class the app declares and the Mono runtime's own.
# Keep line numbers so a crash trace can be read with mapping.txt.
-keepattributes SourceFile,LineNumberTable,*Annotation*,Signature,InnerClasses,EnclosingMethod
-renamesourcefileattribute SourceFile

# Firebase Messaging finds its service by the manifest and its components by name.
-keep class com.google.firebase.messaging.** { *; }
-dontwarn com.google.firebase.**
-dontwarn com.google.android.gms.**
