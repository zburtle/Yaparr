name: Release Android

# The Android app, released on its own: its own version (android-v1.2.3), its own tag, and its own release with the signed package. It is made
# when a commit that concerns the app (its folder, the library, the shared layer; see .github/release/track-filter.js) calls for one, and it
# does not wait for, or hold up, the computer release (release.yml). It runs only when started by hand (Actions, Run workflow, on master), so
# that many merged changes go out as one release; a run that finds nothing to release does nothing.
#
# Its release is never the "latest" one: the computer app updates itself from the latest release, and yaparr.com looks there for the installers,
# so the Android releases are kept out of that and the site looks for the newest Android release on its own.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-android
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # The version code Android compares is made of the version (1.36.2 is 1036002), so a release has to be newer than the one before. A first release
      # made without the tag that says where the numbering stands would start again at 1.0.0, whose code is lower than the installed ones, and no phone would
      # take it as an update. So there has to be a tag already: see "Starting the Android releases" in docs/development.md.
      - name: A tag to count from
        run: |
          if ! git tag --list 'android-v*' | grep -q .; then
            echo "::error::There is no android-v tag, so the version would start again at 1.0.0 and no phone would update to it. Tag the commit of the last package that was released (for example android-v1.46.0) first."
            exit 1
          fi

      # A dry run: semantic-release reads the commits since the last android-v tag that concern the app and, when they call for a release,
      # writes the next version to the step output (see .github/release/android.json). Nothing is tagged yet.
      - name: Work out the version
        id: version
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          (cd .github/release && npm ci --ignore-scripts)
          .github/release/node_modules/.bin/semantic-release --extends ./.github/release/android.json --dry-run

  # The package, signed with the release key: the secrets ANDROID_KEYSTORE_BASE64 (the keystore file, base64), ANDROID_KEYSTORE_PASSWORD,
  # ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD. Without them no package is built: the key in the repository is public, so a package signed with
  # it could be replaced by anyone, and it is never released. The site (yaparr.com) offers the package on Android phones.
  build:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Signing key
        id: key
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No Android signing key is set up in this repository's secrets, so no Android package is built."
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.key.outputs.signed == 'true'

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: steps.key.outputs.signed == 'true'
        with:
          dotnet-version: 10.0.x

      - name: Install the Android workload
        if: steps.key.outputs.signed == 'true'
        run: dotnet workload install android

      - name: Install the Android SDK parts
        if: steps.key.outputs.signed == 'true'
        run: >
          dotnet build apps/Yaparr.Android -t:InstallAndroidDependencies
          -p:JavaSdkDirectory="$JAVA_HOME_21_X64"
          -p:AndroidSdkDirectory="$ANDROID_HOME"
          -p:AcceptAndroidSDKLicenses=true

      # The version code Android compares is made of the release's version (1.36.2 is 1036002), so each release is newer than the last.
      - name: Build the package
        if: steps.key.outputs.signed == 'true'
        run: |
          echo "$KEYSTORE" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/yaparr-release.keystore"
          version='${{ needs.version.outputs.version }}'
          IFS=. read -r major minor patch <<< "${version%%-*}"
          dotnet build apps/Yaparr.Android -c Release \
            -p:ApplicationVersion=$((major * 1000000 + minor * 1000 + patch)) -p:ApplicationDisplayVersion="$version" \
            -p:JavaSdkDirectory="$JAVA_HOME_21_X64" -p:AndroidSdkDirectory="$ANDROID_HOME" \
            -p:AndroidKeyStore=true -p:AndroidSigningKeyStore="$RUNNER_TEMP/yaparr-release.keystore" \
            -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD -p:AndroidSigningKeyAlias="$ANDROID_KEY_ALIAS" \
            -p:AndroidSigningKeyPass=env:ANDROID_KEY_PASSWORD
          mkdir -p artifacts
          cp apps/Yaparr.Android/bin/Release/net10.0-android/org.yaparr.android-Signed.apk "artifacts/Yaparr-$version.apk"
          rm -f "$RUNNER_TEMP/yaparr-release.keystore"

      # The certificate's fingerprint is what yaparr.com's asset links file names, so that links to the site open in the app.
      - name: Show who signed it
        if: steps.key.outputs.signed == 'true'
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$apksigner" verify --print-certs artifacts/Yaparr-*.apk | tee "$RUNNER_TEMP/certs.txt"
          { echo '### Android signing certificate'; grep 'SHA-256' "$RUNNER_TEMP/certs.txt"; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.key.outputs.signed == 'true'
        with:
          name: installer-android
          path: artifacts/*.apk
          if-no-files-found: error

  publish:
    needs: [version, build]
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer-android
          path: installers

      # Tags the built commit and writes the release notes as a draft with the package attached (see .github/release/android.json). If master has moved on
      # since the build, semantic-release refuses and the next run releases everything.
      - name: Make the release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          (cd .github/release && npm ci --ignore-scripts)
          .github/release/node_modules/.bin/semantic-release --extends ./.github/release/android.json

      # Published as a draft above so that it can be published here as not the latest release, with no moment in which it is.
      - name: Publish it, not as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: gh release edit "android-v$VERSION" --draft=false --latest=false --repo "$GITHUB_REPOSITORY"
