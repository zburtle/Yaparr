name: Release installer

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # The tools come from .github/release (package-lock.json pins every package by its hash). A dry run: semantic-release reads the commits since the last tag and, when they call for a release,
      # writes the next version to the step output (see .releaserc.json). Nothing is tagged yet.
      - name: Work out the version
        id: version
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          (cd .github/release && npm ci --ignore-scripts)
          .github/release/node_modules/.bin/semantic-release --dry-run

  windows:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test tests/Yaparr.Tests -c Release

      - name: Build installer
        shell: pwsh
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          $version = '${{ needs.version.outputs.version }}'
          ./installer/build.ps1 -Version $version

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-windows
          path: artifacts/*.msi
          if-no-files-found: error

  deb:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Build package
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          bash installer/build-deb.sh '${{ needs.version.outputs.version }}' ${{ matrix.arch }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-deb-${{ matrix.arch }}
          path: artifacts/*.deb
          if-no-files-found: error

  flatpak:
    needs: version
    if: needs.version.outputs.version != ''
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Install Flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      # The bundles are signed, and say where updates come from, when the repository's key is a secret of this repository.
      - name: Signing key
        id: key
        env:
          KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            export GNUPGHOME="$RUNNER_TEMP/gnupg"
            mkdir -m 700 "$GNUPGHOME"
            echo "$KEY" | gpg --batch --import
            echo "FLATPAK_GPG_HOME=$GNUPGHOME" >> "$GITHUB_ENV"
            echo "FLATPAK_GPG_KEY=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build bundle
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          bash installer/build-flatpak.sh '${{ needs.version.outputs.version }}' ${{ matrix.arch }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-flatpak-${{ matrix.arch }}
          path: artifacts/*.flatpak
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.key.outputs.signed == 'true'
        with:
          name: flatpak-repo-${{ matrix.arch }}
          path: artifacts/flatpak-repo-${{ matrix.arch }}
          if-no-files-found: error

  publish:
    needs: [version, windows, deb, flatpak]
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installer-*
          path: installers
          merge-multiple: true

      # Tags the built commit, writes the release notes and uploads installers/* (see .releaserc.json). If
      # master has moved on since the build, semantic-release refuses and the next run releases everything.
      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          (cd .github/release && npm ci --ignore-scripts)
          .github/release/node_modules/.bin/semantic-release

  # Puts the signed builds in the Flatpak repository, served from the gh-pages branch at flatpak.yaparr.com, so that
  # "flatpak update" finds them. Only runs when the signing key is set up.
  flatpak-repo:
    needs: [version, publish]
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: flatpak-repo-*
          path: flatpak-repos

      - name: Add to the repository
        env:
          KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          TOKEN: ${{ github.token }}
        run: |
          if [ -z "$KEY" ] || [ ! -d flatpak-repos ]; then echo "No signed Flatpak builds; nothing to publish."; exit 0; fi
          sudo apt-get update
          sudo apt-get install -y flatpak ostree gnupg
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          echo "$KEY" | gpg --batch --import
          export FLATPAK_GPG_HOME="$GNUPGHOME"
          export FLATPAK_GPG_KEY="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')"
          remote="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git clone --depth 1 --branch gh-pages "$remote" site || mkdir site
          rm -rf site/.git
          bash installer/publish-flatpak-repo.sh site flatpak-repos/*
          # One commit with the whole site: the branch holds the repository, not its history.
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Flatpak repository for ${{ needs.version.outputs.version }}"
          git push -q --force "$remote" gh-pages
