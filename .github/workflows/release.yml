name: Release installer

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test tests/Yaparr.Tests -c Release

      - name: Build installer
        shell: pwsh
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          ./installer/build.ps1 -Version $version

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $msi = Get-ChildItem artifacts -Filter *.msi | Select-Object -First 1
          gh release create '${{ github.ref_name }}' $msi.FullName --title '${{ github.ref_name }}' --generate-notes
