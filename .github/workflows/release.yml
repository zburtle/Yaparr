name: Release installer

# The computer app: the MSI, the .deb packages and the Flatpak bundles, with its own version (v1.2.3). The Android app has its own release, with its own
# version (android-v1.2.3), in release-android.yml. Each looks only at the commits that concern it (.github/release/track-filter.js).
#
# It runs only when started by hand (Actions, Run workflow, on master), so that many merged changes go out as one release, with the version the
# commits since the last tag call for. A run that finds nothing to release does nothing. "Release all" (release-all.yml) runs this and the Android release
# together.

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # The tools come from .github/release (package-lock.json pins every package by its hash). A dry run: semantic-release reads the commits since the last tag and, when they call for a release,
      # writes the next version to the step output (see .github/release/desktop.json). Nothing is tagged yet.
      - name: Work out the version
        id: version
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          (cd .github/release && npm ci --ignore-scripts)
          .github/release/node_modules/.bin/semantic-release --extends ./.github/release/desktop.json --dry-run

  windows:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      # The tests are not run again here: the pull request that was merged already ran them (test.yml), and running them
      # again took more than half of this job.
      - name: Build installer
        shell: pwsh
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          $version = '${{ needs.version.outputs.version }}'
          ./installer/build.ps1 -Version $version

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-windows
          path: artifacts/*.msi
          if-no-files-found: error

  deb:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      # The packages the app restores are kept between runs, keyed by the project files that name them.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('apps/Yaparr.Desktop/*.csproj', 'src/**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build package
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          bash installer/build-deb.sh '${{ needs.version.outputs.version }}' ${{ matrix.arch }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-deb-${{ matrix.arch }}
          path: artifacts/*.deb
          if-no-files-found: error

  flatpak:
    needs: version
    if: needs.version.outputs.version != ''
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      # A package mirror that stops answering used to hold this step for as long as the job's limit, with nothing to show for it. Now a
      # request gives up after 30 seconds and is tried three times, and the step has a limit of its own.
      - name: Install Flatpak
        timeout-minutes: 10
        run: |
          sudo tee /etc/apt/apt.conf.d/80-ci > /dev/null <<'EOF'
          Acquire::Retries "3";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          EOF
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      # The packages the app restores are kept between runs, keyed by the project files that name them.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('apps/Yaparr.Desktop/*.csproj', 'src/**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      # flatpak-builder keeps the stages it has built, and FFmpeg alone takes a minute and a half to compile. With the same manifest on
      # the same architecture those stages are reused, so only the app itself is put together again.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .flatpak-builder
          key: flatpak-builder-${{ matrix.arch }}-${{ hashFiles('installer/flatpak/com.yaparr.Yaparr.yml') }}
          restore-keys: flatpak-builder-${{ matrix.arch }}-

      # The bundles are signed, and say where updates come from, when the repository's key is a secret of this repository.
      - name: Signing key
        id: key
        env:
          KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            export GNUPGHOME="$RUNNER_TEMP/gnupg"
            mkdir -m 700 "$GNUPGHOME"
            echo "$KEY" | gpg --batch --import
            echo "FLATPAK_GPG_HOME=$GNUPGHOME" >> "$GITHUB_ENV"
            echo "FLATPAK_GPG_KEY=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build bundle
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          bash installer/build-flatpak.sh '${{ needs.version.outputs.version }}' ${{ matrix.arch }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-flatpak-${{ matrix.arch }}
          path: artifacts/*.flatpak
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.key.outputs.signed == 'true'
        with:
          name: flatpak-repo-${{ matrix.arch }}
          path: artifacts/flatpak-repo-${{ matrix.arch }}
          if-no-files-found: error

  publish:
    needs: [version, windows, deb, flatpak]
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installer-*
          path: installers
          merge-multiple: true

      # Tags the built commit, writes the release notes and uploads installers/* (see .github/release/desktop.json). If
      # master has moved on since the build, semantic-release refuses and the next run releases everything.
      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          (cd .github/release && npm ci --ignore-scripts)
          .github/release/node_modules/.bin/semantic-release --extends ./.github/release/desktop.json

  # The library as a package in GitHub Packages, for the version that was just tagged.
  package:
    needs: [version, publish]
    if: needs.version.outputs.version != ''
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/nuget.yml
    with:
      version: ${{ needs.version.outputs.version }}

  # Puts the signed builds in the Flatpak repository, so that "flatpak update" finds them. The repository is a repository of its own, Yaparr.Flatpak,
  # served from its gh-pages branch at flatpak.yaparr.com, so that it and its signing key stay apart from this one: this workflow's token cannot write
  # to another repository, so the push is made with a deploy key (write access to that one repository only), the secret FLATPAK_REPO_DEPLOY_KEY.
  # Only runs when both the signing key and the deploy key are set up.
  flatpak-repo:
    needs: [version, publish]
    if: needs.version.outputs.version != ''
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: flatpak-repo-*
          path: flatpak-repos

      - name: Add to the repository
        env:
          KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          DEPLOY_KEY: ${{ secrets.FLATPAK_REPO_DEPLOY_KEY }}
          FLATPAK_REPO: ${{ github.repository_owner }}/Yaparr.Flatpak
        run: |
          if [ -z "$KEY" ] || [ ! -d flatpak-repos ]; then echo "No signed Flatpak builds; nothing to publish."; exit 0; fi
          if [ -z "$DEPLOY_KEY" ]; then echo "::error::There is no FLATPAK_REPO_DEPLOY_KEY, so the Flatpak builds cannot be added to the repository."; exit 1; fi
          sudo apt-get update
          sudo apt-get install -y flatpak ostree gnupg
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          echo "$KEY" | gpg --batch --import
          export FLATPAK_GPG_HOME="$GNUPGHOME"
          export FLATPAK_GPG_KEY="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')"
          # The deploy key, and GitHub's own host key (its published fingerprint, so a different server is not trusted).
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/flatpak_repo"
          chmod 600 "$HOME/.ssh/flatpak_repo"
          ssh-keyscan -t ed25519 github.com > "$RUNNER_TEMP/github_host" 2>/dev/null
          expected="$(curl -fsS https://api.github.com/meta | jq -r '.ssh_key_fingerprints.SHA256_ED25519')"
          ssh-keygen -lf "$RUNNER_TEMP/github_host" | grep -qF "$expected" || { echo "::error::The host key of github.com is not the published one."; exit 1; }
          cp "$RUNNER_TEMP/github_host" "$HOME/.ssh/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/flatpak_repo -o IdentitiesOnly=yes"
          remote="git@github.com:${FLATPAK_REPO}.git"
          git clone --depth 1 --branch gh-pages "$remote" site || mkdir site
          rm -rf site/.git
          bash installer/publish-flatpak-repo.sh site flatpak-repos/*
          # One commit with the whole site: the branch holds the repository, not its history.
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Flatpak repository for ${{ needs.version.outputs.version }}"
          git push -q --force "$remote" gh-pages
