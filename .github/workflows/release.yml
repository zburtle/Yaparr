name: Release installer

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # The tools come from .github/release (package-lock.json pins every package by its hash). A dry run: semantic-release reads the commits since the last tag and, when they call for a release,
      # writes the next version to the step output (see .releaserc.json). Nothing is tagged yet.
      - name: Work out the version
        id: version
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          (cd .github/release && npm ci --ignore-scripts)
          .github/release/node_modules/.bin/semantic-release --dry-run

  windows:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # The tests are not run again here: the pull request that was merged already ran them (test.yml), and running them
      # again took more than half of this job.
      - name: Build installer
        shell: pwsh
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          $version = '${{ needs.version.outputs.version }}'
          ./installer/build.ps1 -Version $version

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-windows
          path: artifacts/*.msi
          if-no-files-found: error

  deb:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # The packages the app restores are kept between runs, keyed by the project files that name them.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('apps/Yaparr.Desktop/*.csproj', 'src/**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build package
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          bash installer/build-deb.sh '${{ needs.version.outputs.version }}' ${{ matrix.arch }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-deb-${{ matrix.arch }}
          path: artifacts/*.deb
          if-no-files-found: error

  # The Android package, signed with the release key: the secrets ANDROID_KEYSTORE_BASE64 (the keystore file, base64), ANDROID_KEYSTORE_PASSWORD,
  # ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD. Without them no package is built: the key in the repository is public, so a package signed with
  # it could be replaced by anyone, and it is never released. The site (yaparr.com) offers the package on Android phones.
  android:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Signing key
        id: key
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No Android signing key is set up in this repository's secrets, so no Android package is built."
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.key.outputs.signed == 'true'

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: steps.key.outputs.signed == 'true'
        with:
          dotnet-version: 10.0.x

      - name: Install the Android workload
        if: steps.key.outputs.signed == 'true'
        run: dotnet workload install android

      - name: Install the Android SDK parts
        if: steps.key.outputs.signed == 'true'
        run: >
          dotnet build apps/Yaparr.Android -t:InstallAndroidDependencies
          -p:JavaSdkDirectory="$JAVA_HOME_21_X64"
          -p:AndroidSdkDirectory="$ANDROID_HOME"
          -p:AcceptAndroidSDKLicenses=true

      # The version code Android compares is made of the release's version (1.36.2 is 1036002), so each release is newer than the last.
      - name: Build the package
        if: steps.key.outputs.signed == 'true'
        run: |
          echo "$KEYSTORE" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/yaparr-release.keystore"
          version='${{ needs.version.outputs.version }}'
          IFS=. read -r major minor patch <<< "${version%%-*}"
          dotnet build apps/Yaparr.Android -c Release \
            -p:ApplicationVersion=$((major * 1000000 + minor * 1000 + patch)) -p:ApplicationDisplayVersion="$version" \
            -p:JavaSdkDirectory="$JAVA_HOME_21_X64" -p:AndroidSdkDirectory="$ANDROID_HOME" \
            -p:AndroidKeyStore=true -p:AndroidSigningKeyStore="$RUNNER_TEMP/yaparr-release.keystore" \
            -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD -p:AndroidSigningKeyAlias="$ANDROID_KEY_ALIAS" \
            -p:AndroidSigningKeyPass=env:ANDROID_KEY_PASSWORD
          mkdir -p artifacts
          cp apps/Yaparr.Android/bin/Release/net10.0-android/org.yaparr.android-Signed.apk "artifacts/Yaparr-$version.apk"
          rm -f "$RUNNER_TEMP/yaparr-release.keystore"

      # The certificate's fingerprint is what yaparr.com's asset links file names, so that links to the site open in the app.
      - name: Show who signed it
        if: steps.key.outputs.signed == 'true'
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$apksigner" verify --print-certs artifacts/Yaparr-*.apk | tee "$RUNNER_TEMP/certs.txt"
          { echo '### Android signing certificate'; grep 'SHA-256' "$RUNNER_TEMP/certs.txt"; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.key.outputs.signed == 'true'
        with:
          name: installer-android
          path: artifacts/*.apk
          if-no-files-found: error

  flatpak:
    needs: version
    if: needs.version.outputs.version != ''
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # A package mirror that stops answering used to hold this step for as long as the job's limit, with nothing to show for it. Now a
      # request gives up after 30 seconds and is tried three times, and the step has a limit of its own.
      - name: Install Flatpak
        timeout-minutes: 5
        run: |
          sudo tee /etc/apt/apt.conf.d/80-ci > /dev/null <<'EOF'
          Acquire::Retries "3";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          EOF
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      # The packages the app restores are kept between runs, keyed by the project files that name them.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('apps/Yaparr.Desktop/*.csproj', 'src/**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      # flatpak-builder keeps the stages it has built, and FFmpeg alone takes a minute and a half to compile. With the same manifest on
      # the same architecture those stages are reused, so only the app itself is put together again.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .flatpak-builder
          key: flatpak-builder-${{ matrix.arch }}-${{ hashFiles('installer/flatpak/com.yaparr.Yaparr.yml') }}
          restore-keys: flatpak-builder-${{ matrix.arch }}-

      # The bundles are signed, and say where updates come from, when the repository's key is a secret of this repository.
      - name: Signing key
        id: key
        env:
          KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            export GNUPGHOME="$RUNNER_TEMP/gnupg"
            mkdir -m 700 "$GNUPGHOME"
            echo "$KEY" | gpg --batch --import
            echo "FLATPAK_GPG_HOME=$GNUPGHOME" >> "$GITHUB_ENV"
            echo "FLATPAK_GPG_KEY=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build bundle
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          bash installer/build-flatpak.sh '${{ needs.version.outputs.version }}' ${{ matrix.arch }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-flatpak-${{ matrix.arch }}
          path: artifacts/*.flatpak
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.key.outputs.signed == 'true'
        with:
          name: flatpak-repo-${{ matrix.arch }}
          path: artifacts/flatpak-repo-${{ matrix.arch }}
          if-no-files-found: error

  publish:
    needs: [version, windows, deb, flatpak, android]
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installer-*
          path: installers
          merge-multiple: true

      # Tags the built commit, writes the release notes and uploads installers/* (see .releaserc.json). If
      # master has moved on since the build, semantic-release refuses and the next run releases everything.
      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          (cd .github/release && npm ci --ignore-scripts)
          .github/release/node_modules/.bin/semantic-release

  # The library as a package in GitHub Packages, for the version that was just tagged.
  package:
    needs: [version, publish]
    if: needs.version.outputs.version != ''
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/nuget.yml
    with:
      version: ${{ needs.version.outputs.version }}

  # Puts the signed builds in the Flatpak repository, served from the gh-pages branch at flatpak.yaparr.com, so that
  # "flatpak update" finds them. Only runs when the signing key is set up.
  flatpak-repo:
    needs: [version, publish]
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: flatpak-repo-*
          path: flatpak-repos

      - name: Add to the repository
        env:
          KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          TOKEN: ${{ github.token }}
        run: |
          if [ -z "$KEY" ] || [ ! -d flatpak-repos ]; then echo "No signed Flatpak builds; nothing to publish."; exit 0; fi
          sudo apt-get update
          sudo apt-get install -y flatpak ostree gnupg
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          echo "$KEY" | gpg --batch --import
          export FLATPAK_GPG_HOME="$GNUPGHOME"
          export FLATPAK_GPG_KEY="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')"
          remote="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git clone --depth 1 --branch gh-pages "$remote" site || mkdir site
          rm -rf site/.git
          bash installer/publish-flatpak-repo.sh site flatpak-repos/*
          # One commit with the whole site: the branch holds the repository, not its history.
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Flatpak repository for ${{ needs.version.outputs.version }}"
          git push -q --force "$remote" gh-pages
