name: Release installer

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # A dry run: semantic-release reads the commits since the last tag and, when they call for a release,
      # writes the next version to the step output (see .releaserc.json). Nothing is tagged yet.
      - name: Work out the version
        id: version
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npx --yes -p semantic-release@25.0.9 -p @semantic-release/exec@7.1.0 semantic-release --dry-run

  windows:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test tests/Yaparr.Tests -c Release

      - name: Build installer
        shell: pwsh
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          $version = '${{ needs.version.outputs.version }}'
          ./installer/build.ps1 -Version $version

      - uses: actions/upload-artifact@v7
        with:
          name: installer-windows
          path: artifacts/*.msi
          if-no-files-found: error

  deb:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build package
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          bash installer/build-deb.sh '${{ needs.version.outputs.version }}' ${{ matrix.arch }}

      - uses: actions/upload-artifact@v7
        with:
          name: installer-deb-${{ matrix.arch }}
          path: artifacts/*.deb
          if-no-files-found: error

  publish:
    needs: [version, windows, deb]
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/download-artifact@v8
        with:
          pattern: installer-*
          path: installers
          merge-multiple: true

      # Tags the built commit, writes the release notes and uploads installers/* (see .releaserc.json). If
      # master has moved on since the build, semantic-release refuses and the next run releases everything.
      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npx --yes -p semantic-release@25.0.9 -p @semantic-release/exec@7.1.0 semantic-release
