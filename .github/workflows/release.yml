name: Release installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the latest version to increase
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'push') {
            $tag = '${{ github.ref_name }}'
          } else {
            git fetch --tags --force
            $latest = git tag --list 'v[0-9]*' --sort=-v:refname | Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } | Select-Object -First 1
            if (-not $latest) { $latest = 'v0.0.0' }
            $major, $minor, $patch = $latest.TrimStart('v').Split('.') | ForEach-Object { [int]$_ }
            switch ('${{ inputs.bump }}') {
              'major' { $major++; $minor = 0; $patch = 0 }
              'minor' { $minor++; $patch = 0 }
              default { $patch++ }
            }
            $tag = "v$major.$minor.$patch"
            Write-Host "Latest tag $latest, releasing $tag"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test tests/Yaparr.Tests -c Release

      - name: Build installer
        shell: pwsh
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          TurnServer: ${{ secrets.TURN_SERVER }}
          TurnUser: ${{ secrets.TURN_USER }}
          TurnCredential: ${{ secrets.TURN_CREDENTIAL }}
        run: |
          $version = '${{ needs.version.outputs.tag }}'.TrimStart('v')
          ./installer/build.ps1 -Version $version

      - uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: artifacts/*.msi
          if-no-files-found: error

  deb:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build package
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          TurnServer: ${{ secrets.TURN_SERVER }}
          TurnUser: ${{ secrets.TURN_USER }}
          TurnCredential: ${{ secrets.TURN_CREDENTIAL }}
        run: |
          version='${{ needs.version.outputs.tag }}'
          bash installer/build-deb.sh "${version#v}" ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: installer-deb-${{ matrix.arch }}
          path: artifacts/*.deb
          if-no-files-found: error

  publish:
    needs: [version, windows, deb]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: installers
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # For a manual run the tag does not exist yet; --target makes gh create it on the built commit.
          gh release create '${{ needs.version.outputs.tag }}' installers/* --title '${{ needs.version.outputs.tag }}' --target '${{ github.sha }}' --generate-notes
