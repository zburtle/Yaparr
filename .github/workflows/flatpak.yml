name: Flatpak build

# Builds the Flatpak bundles without making a release, to check changes to the manifest or the build script, and on request.
# A release builds the same bundles (release.yml) and attaches them.
on:
  pull_request:
    paths:
      - installer/flatpak/**
      - installer/build-flatpak.sh
      - .github/workflows/flatpak.yml
  workflow_dispatch:

# A newer push to the same pull request replaces the run that is still going: its result would be out of date.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  flatpak:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      # A package mirror that stops answering used to hold this step for as long as the job's limit, with nothing to show for it. Now a
      # request gives up after 30 seconds and is tried three times, and the step has a limit of its own.
      - name: Install Flatpak
        timeout-minutes: 5
        run: |
          sudo tee /etc/apt/apt.conf.d/80-ci > /dev/null <<'EOF'
          Acquire::Retries "3";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          EOF
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder appstream

      # The packages the app restores are kept between runs, keyed by the project files that name them.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('apps/Yaparr.Desktop/*.csproj', 'src/**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      # flatpak-builder keeps the stages it has built, and FFmpeg alone takes a minute and a half to compile. With the same manifest on
      # the same architecture those stages are reused, so only the app itself is put together again.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .flatpak-builder
          key: flatpak-builder-${{ matrix.arch }}-${{ hashFiles('installer/flatpak/com.yaparr.Yaparr.yml') }}
          restore-keys: flatpak-builder-${{ matrix.arch }}-

      - name: Check the AppStream file
        run: |
          sed -e 's/@VERSION@/0.0.0/' -e "s/@DATE@/$(date -u +%Y-%m-%d)/" installer/flatpak/com.yaparr.Yaparr.metainfo.xml.in > /tmp/metainfo.xml
          appstreamcli validate --no-net /tmp/metainfo.xml

      - name: Build bundle
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash installer/build-flatpak.sh 0.0.0 ${{ matrix.arch }}

      - name: Run the bundle in the sandbox
        # The bundle is installed and started for a few seconds on a virtual screen, to catch a missing library or a wrong path.
        run: |
          sudo apt-get install -y xvfb dbus-x11
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive artifacts/yaparr_0.0.0_${{ matrix.arch }}.flatpak
          cat > /tmp/check.sh <<'EOF'
          set -ex
          run="flatpak run --no-a11y-bus --no-documents-portal"
          $run --command=ffmpeg com.yaparr.Yaparr -hide_banner -decoders | grep -E ' (vp8|h264) '
          # Sharing a screen: the encoders and the screen grabber, the programs that list monitors, windows and sound, and GStreamer's
          # PipeWire source (Wayland).
          $run --command=ffmpeg com.yaparr.Yaparr -hide_banner -encoders | grep -E ' (libvpx|h264_nvenc|h264_vaapi) '
          $run --command=ffmpeg com.yaparr.Yaparr -hide_banner -devices | grep x11grab
          $run --command=sh com.yaparr.Yaparr -c 'for p in xrandr xprop xwininfo pactl parec gst-launch-1.0 gst-inspect-1.0; do command -v $p; done; gst-inspect-1.0 pipewiresrc > /dev/null'
          # A real capture of the virtual screen, encoded as VP8, with the sandbox's own programs.
          xvfb-run -a $run --command=sh com.yaparr.Yaparr -c 'xrandr --listmonitors && ffmpeg -hide_banner -loglevel error -nostdin -f x11grab -framerate 5 -video_size 320x240 -i "$DISPLAY" -vf format=yuv420p -c:v libvpx -deadline realtime -t 2 -f ivf pipe:1 | wc -c | grep -vx 0'
          $run --command=sh com.yaparr.Yaparr -c 'ls /app/lib/yaparr | grep -E "libwebrtc-apm|libSkiaSharp|libminiaudio"'
          status=0
          xvfb-run -a timeout 20 $run com.yaparr.Yaparr --name check || status=$?
          # 124 means it was still running when the time was up, which is what we want.
          test "$status" = 124
          $run --command=sh com.yaparr.Yaparr -c 'grep -q "starting" $XDG_DATA_HOME/Yaparr/logs/*.log'
          EOF
          dbus-run-session -- bash /tmp/check.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flatpak-${{ matrix.arch }}
          path: artifacts/*.flatpak
          if-no-files-found: error
