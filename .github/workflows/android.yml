name: Android

# Builds the Android app the way a release does (Release configuration) and keeps the package as a download (the run's artifact, 14 days) so it can
# be tried on a phone. It has its own workflow because it needs the Android workload, a JDK and the Android SDK, which the other
# jobs do not: a change that cannot affect it does not run it, and a problem with it does not hold up the tests.
# Nothing here is a required check for merging. It runs for pull requests only: after a merge the release workflow builds the package again (signed),
# so a run on master would be the same build a third time.
on:
  pull_request:
    paths:
      # What the app is made of: it uses the library and the shared layer, and nothing else under src (screen sharing, the WebRTC voice library
      # and the like are for the computer).
      - 'apps/Yaparr.Android/**'
      - 'src/Yaparr/**'
      - 'src/Yaparr.AppCore/**'
      - 'Directory.Build.props'
      - '.github/workflows/android.yml'

# A newer push to the same pull request replaces the run that is still going: its result would be out of date.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Install the Android workload
        run: dotnet workload install android

      # The runner has a JDK 21 and an Android SDK; this fetches the platform and build tools the app needs.
      - name: Install the Android SDK parts
        run: >
          dotnet build apps/Yaparr.Android -t:InstallAndroidDependencies
          -p:JavaSdkDirectory="$JAVA_HOME_21_X64"
          -p:AndroidSdkDirectory="$ANDROID_HOME"
          -p:AcceptAndroidSDKLicenses=true

      # The release build (trimmed, shortened) is what a release ships, so it is the one built here: a problem is found before a merge starts a release.
      # It is signed with the repository's debug key (the same for every build, so each installs over the last; the version number is the run number,
      # which only goes up), so the file can be installed on a phone as it is. The package for a release is signed with the release key, in the release
      # workflow. The build log is kept if it fails.
      - name: Build the Android app
        run: >
          dotnet build apps/Yaparr.Android -c Release -bl:release.binlog
          -p:ApplicationVersion=${{ github.run_number }}
          -p:JavaSdkDirectory="$JAVA_HOME_21_X64"
          -p:AndroidSdkDirectory="$ANDROID_HOME"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: android-release-build-log
          path: release.binlog
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yaparr-android
          path: apps/Yaparr.Android/bin/Release/net10.0-android/*-Signed.apk
          if-no-files-found: error
          retention-days: 14
