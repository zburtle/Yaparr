name: Test

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test tests/Yaparr.Tests -c Release

      - name: Build the desktop apps
        run: |
          dotnet build samples/Yaparr.Desktop -c Release
          dotnet build samples/Yaparr.Wpf -c Release
