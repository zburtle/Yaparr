name: Test

# Only a change that can affect the build or the tests runs them: the code, the project files, what the desktop app copies into its output
# (the licence and notice files), the tools it restores, and this file. Documentation, the backlog and the other workflows do not.
# Nothing here is a required check for merging, so a pull request that skips the tests is not held up.
on:
  pull_request:
    paths:
      - 'src/**'
      - 'apps/**'
      - 'tests/**'
      - 'tools/**'
      - 'installer/**'
      - 'Yaparr.slnx'
      - 'Directory.Build.props'
      - 'dotnet-tools.json'
      - 'LICENSE.txt'
      - 'COPYING'
      - 'THIRD-PARTY-NOTICES*.txt'
      - '.github/workflows/test.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test tests/Yaparr.Tests -c Release

      - name: Build the desktop app
        run: dotnet build apps/Yaparr.Desktop -c Release

  # Screen sharing on Linux: the command lines for x11grab and VA-API, the window and monitor lists, and a real capture of a
  # virtual X server (Xvfb) with FFmpeg. The rest of the tests are not run here yet.
  screen-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Install FFmpeg and a virtual X server
        run: sudo apt-get update && sudo apt-get install -y ffmpeg xvfb x11-utils x11-xserver-utils

      - name: Test
        run: dotnet test tests/Yaparr.Tests -c Release --filter "FullyQualifiedName~LinuxScreenTests|FullyQualifiedName~ScreenTests|FullyQualifiedName~H264Tests|FullyQualifiedName~GpuScaleTests|FullyQualifiedName~RetargetTests"
