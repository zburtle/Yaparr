name: Release all

# Starts the computer release (release.yml) and the Android release (release-android.yml) together, so that both are made from one click and build at
# the same time. They stay separate releases with their own versions and tags, and neither waits for the other: if one fails the other still goes out,
# and the failed one can be run again on its own. Each can still be started by hand from its own workflow.
#
# Run it from the Actions tab (Run workflow, on master).
on:
  workflow_dispatch:
    inputs:
      installer:
        description: Release the computer app (MSI, .deb, Flatpak)
        type: boolean
        default: true
      android:
        description: Release the Android app
        type: boolean
        default: true

# What the two workflows need between them: the releases and tags, and the library package that the computer release publishes.
permissions:
  contents: write
  packages: write

jobs:
  installer:
    if: inputs.installer
    uses: ./.github/workflows/release.yml
    secrets: inherit

  android:
    if: inputs.android
    uses: ./.github/workflows/release-android.yml
    secrets: inherit
