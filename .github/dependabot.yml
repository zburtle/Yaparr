version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  # The tools the release workflow runs (semantic-release), pinned by .github/release/package-lock.json.
  - package-ecosystem: npm
    directory: /.github/release
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    # Avalonia.Skia brings its own SkiaSharp and the native Linux library that goes with it. SkiaSharp here has to be the same version, or the
    # Linux packages fail to start ("native libSkiaSharp is incompatible"); it is raised together with Avalonia, by hand.
    ignore:
      - dependency-name: SkiaSharp
    commit-message:
      prefix: fix
      prefix-development: chore
