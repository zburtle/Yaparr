<svg xmlns="http://www.w3.org/2000/svg" width="680" height="370" viewBox="0 0 680 370" font-family="Segoe UI, Arial, sans-serif" role="img">
<title>How tree-based screen sharing works</title>
<desc>A sharer sends the screen to two viewers. Each of those viewers passes it on to two more viewers, so the sharer never sends to everyone.</desc>
<defs>
<marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="370" fill="#ffffff"/>
<g stroke-width="1.5" fill="none">
<line x1="320" y1="86" x2="195" y2="136" stroke="#534AB7" marker-end="url(#p)"/>
<line x1="360" y1="86" x2="485" y2="136" stroke="#534AB7" marker-end="url(#p)"/>
<line x1="175" y1="196" x2="120" y2="246" stroke="#0F6E56" marker-end="url(#t)"/>
<line x1="215" y1="196" x2="270" y2="246" stroke="#0F6E56" marker-end="url(#t)"/>
<line x1="465" y1="196" x2="410" y2="246" stroke="#0F6E56" marker-end="url(#t)"/>
<line x1="505" y1="196" x2="560" y2="246" stroke="#0F6E56" marker-end="url(#t)"/>
</g>
<g text-anchor="middle" dominant-baseline="central">
<rect x="250" y="30" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="340" y="48" font-size="14" font-weight="600" fill="#3C3489">Sharer</text>
<text x="340" y="68" font-size="12" fill="#534AB7">Sends to just two</text>
<rect x="120" y="140" width="150" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="195" y="158" font-size="14" font-weight="600" fill="#085041">Viewer</text>
<text x="195" y="178" font-size="12" fill="#0F6E56">Passes it on</text>
<rect x="410" y="140" width="150" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="485" y="158" font-size="14" font-weight="600" fill="#085041">Viewer</text>
<text x="485" y="178" font-size="12" fill="#0F6E56">Passes it on</text>
<rect x="70" y="250" width="100" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="120" y="268" font-size="14" font-weight="600" fill="#444441">Viewer</text>
<text x="120" y="288" font-size="12" fill="#5F5E5A">Watching</text>
<rect x="220" y="250" width="100" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="270" y="268" font-size="14" font-weight="600" fill="#444441">Viewer</text>
<text x="270" y="288" font-size="12" fill="#5F5E5A">Watching</text>
<rect x="360" y="250" width="100" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="410" y="268" font-size="14" font-weight="600" fill="#444441">Viewer</text>
<text x="410" y="288" font-size="12" fill="#5F5E5A">Watching</text>
<rect x="510" y="250" width="100" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="560" y="268" font-size="14" font-weight="600" fill="#444441">Viewer</text>
<text x="560" y="288" font-size="12" fill="#5F5E5A">Watching</text>
<text x="340" y="342" font-size="12" fill="#444441">Each arrow is one copy of the picture. More viewers means a deeper tree, not more upload.</text>
</g>
</svg>
